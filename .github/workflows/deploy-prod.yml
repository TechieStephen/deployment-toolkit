name: Deploy to Prod

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      project:
        required: false
        type: string
        default: ''
    secrets:
      MSDEPLOY_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: windows-latest
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout deployment toolkit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/deployment-toolkit
          ref: main
          path: deployment-toolkit

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts

      - name: Load environment configuration
        shell: pwsh
        env:
          VARS_CONTEXT: ${{ toJSON(vars) }}
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
        run: |
          function Set-EnvFromJson([string]$json, [string]$source) {
              $parsed = $json | ConvertFrom-Json
              foreach ($property in $parsed.PSObject.Properties) {
                  $delimiter = [System.Guid]::NewGuid().ToString()
                  "$($property.Name)<<$delimiter" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "$($property.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  "$delimiter" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

                  # Name and source only -- never the value, even for Variables.
                  Write-Host "[ENV] $($property.Name) <- $source = $($property.Value)"
              }
          }

          # Variables first, secrets second, so a secret wins on any name collision.
          Set-EnvFromJson $env:VARS_CONTEXT "vars"
          Set-EnvFromJson $env:SECRETS_CONTEXT "secrets"

      - name: Deploy with Web Deploy
        shell: pwsh
        run: |
          ./deployment-toolkit/scripts/Deploy-WebDeploy.ps1 `
            -RepositoryRoot ${{ github.workspace }} `
            -ToolkitRoot ./deployment-toolkit `
            -Project "${{ inputs.project }}"

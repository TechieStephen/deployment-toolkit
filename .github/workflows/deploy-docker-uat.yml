name: Docker Deploy (UAT)

on:
  workflow_call:
    inputs:
      compose_project_dir:
        description: "Absolute path on the VPS where this app's docker-compose.yml lives, e.g. /opt/apps/vendeck"
        required: true
        type: string
      health_check_url:
        description: "Optional: a URL to poll after deploying, e.g. https://api-uat.vendeck.ng/health. Deploy fails if it never returns 200. Leave unset for an app with no health endpoint."
        required: false
        type: string
    secrets:
      VPS_SSH_PRIVATE_KEY:
        required: true
      GHCR_PAT:
        description: "PAT with read:packages, used by the VPS to pull images from GHCR"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: UAT
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Every var/secret configured on this GitHub Environment becomes a line
      # in .env on the VPS -- same "toolkit never needs to know a consuming
      # project's variable/secret names ahead of time" approach the Web
      # Deploy path uses, just handed to the container as env vars instead
      # of patched into an appsettings.json file.
      #
      # DEPLOY_MECHANISM_KEYS excludes the ones this same workflow already consumes directly via
      # its own ${{ vars.* }}/${{ secrets.* }} expressions above/below -- they have no reason to
      # also end up inside the deployed app's own .env/container environment. Confirmed the hard
      # way: VPS_SSH_PRIVATE_KEY (multi-line PEM) broke docker compose's own .env parser outright
      # ("unexpected character '+' in variable name" on one of the key's base64 body lines), which
      # is how this got caught -- but the real problem is a private key sitting in an app
      # container's environment at all, parsing failure or not. github_token is GITHUB_TOKEN
      # (present because a caller job typically uses `secrets: inherit`), also mechanism-only.
      - name: Build .env from environment configuration
        shell: bash
        env:
          VARS_CONTEXT: ${{ toJSON(vars) }}
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          DEPLOY_MECHANISM_KEYS: "vps_host vps_deploy_user vps_ssh_private_key ghcr_pat github_token"
        run: |
          # Piping the exclude array straight into index(.key) resets `.` to the array itself for
          # evaluating index's own argument, so `.key` fails with "Cannot index array with string
          # \"key\"" -- confirmed the hard way. Binding it to $excludeList first avoids the reset:
          # a $var reference doesn't touch `.`, so `.key` inside select() still means the current
          # to_entries[] object, not whatever the last `|` happened to produce.
          FILTER='($exclude | ascii_downcase | split(" ")) as $excludeList | to_entries[] | select((.key | ascii_downcase | IN($excludeList[])) | not) | "\(.key)=\(.value)"'
          jq -r --arg exclude "$DEPLOY_MECHANISM_KEYS" "$FILTER" <<< "$VARS_CONTEXT" > deploy.env
          jq -r --arg exclude "$DEPLOY_MECHANISM_KEYS" "$FILTER" <<< "$SECRETS_CONTEXT" >> deploy.env
          echo "TAG=${{ github.ref_name }}" >> deploy.env

      - name: Copy compose file and environment to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy.env"
          target: ${{ inputs.compose_project_dir }}

      - name: Deploy via docker compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_DEPLOY_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          # set -e is not the ssh-action's default -- without it, a real deploy silently no-op'd
          # (docker login denied -> pull unauthorized -> Compose's own build-from-source fallback
          # then also failed with no Dockerfile on the VPS to build from) while this step still
          # reported "Successfully executed commands to all hosts.", because each failing command
          # just fell through to the next line instead of stopping the script. Confirmed on a real
          # UAT deploy: green CI, un-updated container, for two deploys in a row before this was
          # caught. docker image prune -f staying last and unaffected by set -e's exit-on-failure
          # is fine -- nothing to prune if nothing above it changed.
          script: |
            set -euo pipefail
            cd ${{ inputs.compose_project_dir }}
            mv deploy.env .env
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f

      # Runs from the GitHub Actions runner, not the VPS -- it's checking the same public path a
      # real client would hit (through Cloudflare/Caddy), not just "did the container start", so it
      # also catches a container that's up but the app inside never became ready. Retries with a
      # short delay since docker compose up -d returning doesn't mean the app inside has finished
      # starting yet (migrations, Hangfire storage init, etc.).
      - name: Verify health endpoint after deploy
        if: inputs.health_check_url != ''
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ inputs.health_check_url }}" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Health check passed (attempt $attempt, status $status)"
              exit 0
            fi
            echo "Attempt $attempt: got status $status, retrying in 3s..."
            sleep 3
          done
          echo "::error::Health check at ${{ inputs.health_check_url }} never returned 200 after 10 attempts"
          exit 1
